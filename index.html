<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Eksperimen & Administrasi LPQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(59, 130, 246, 0.5) rgba(229, 231, 235, 0.5);
        }

        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        *::-webkit-scrollbar-track {
            background: rgba(229, 231, 235, 0.5);
        }

        *::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.7);
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 4px;
        }

        @media print {
            body, html {
                margin: 0;
                padding: 0;
                width: 210mm;
                height: auto;
                min-height: 297mm;
            }

            .no-print {
                display: none !important;
            }

            .print-container {
                width: 210mm;
                height: 297mm;
                padding: 15mm;
                margin: 0;
                box-sizing: border-box;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color-adjust: exact;
            }

            .print-content {
                width: 100%;
                height: 100%;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                color-adjust: exact;
                font-family: Arial, sans-serif;
            }

            .print-header {
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 2px solid #000;
                padding-bottom: 10px;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .print-body {
                margin: 20px 0;
                line-height: 1.6;
            }

            .print-footer {
                margin-top: 30px;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
            }

            .print-signature {
                text-align: center;
                width: 45%;
            }

            .print-qr {
                width: 120px;
                height: 120px;
            }

            @page {
                size: A4;
                margin: 0;
            }
        }

        .glassmorphism {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .toast-enter {
            animation: fade-in 0.3s ease-out;
        }

        .toast-exit {
            animation: fade-in 0.3s ease-out reverse;
        }

        .blur-bg {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.1;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ==================== TOAST NOTIFICATION ====================
        function ToastNotification({ message, type = 'info', onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500',
                warning: 'bg-yellow-500'
            }[type];

            return (
                <div className={`toast-enter fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50`}>
                    {message}
                </div>
            );
        }

        // ==================== ADDRESS CASCADER ====================
        function AddressCascader({ onAddressChange, initialValues = {} }) {
            const [provinsi, setProvinsi] = useState(initialValues.provinsi || '');
            const [kabupaten, setKabupaten] = useState(initialValues.kabupaten || '');
            const [kecamatan, setKecamatan] = useState(initialValues.kecamatan || '');
            const [desa, setDesa] = useState(initialValues.desa || '');

            const [provinsiList, setProvinsiList] = useState([]);
            const [kabupatenList, setKabupatenList] = useState([]);
            const [kecamatanList, setKecamatanList] = useState([]);
            const [desaList, setDesaList] = useState([]);

            useEffect(() => {
                fetch('https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json')
                    .then(r => r.json())
                    .then(data => setProvinsiList(data))
                    .catch(e => console.error('Fetch provinsi error:', e));
            }, []);

            const handleProvinsiChange = (e) => {
                const val = e.target.value;
                setProvinsi(val);
                setKabupaten('');
                setKecamatan('');
                setDesa('');
                if (val) {
                    fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/regencies/${val}.json`)
                        .then(r => r.json())
                        .then(data => setKabupatenList(data))
                        .catch(e => console.error('Fetch kabupaten error:', e));
                }
                onAddressChange({ provinsi: val, kabupaten: '', kecamatan: '', desa: '' });
            };

            const handleKabupatenChange = (e) => {
                const val = e.target.value;
                setKabupaten(val);
                setKecamatan('');
                setDesa('');
                if (val) {
                    fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/districts/${val}.json`)
                        .then(r => r.json())
                        .then(data => setKecamatanList(data))
                        .catch(e => console.error('Fetch kecamatan error:', e));
                }
                onAddressChange({ provinsi, kabupaten: val, kecamatan: '', desa: '' });
            };

            const handleKecamatanChange = (e) => {
                const val = e.target.value;
                setKecamatan(val);
                setDesa('');
                if (val) {
                    fetch(`https://www.emsifa.com/api-wilayah-indonesia/api/villages/${val}.json`)
                        .then(r => r.json())
                        .then(data => setDesaList(data))
                        .catch(e => console.error('Fetch desa error:', e));
                }
                onAddressChange({ provinsi, kabupaten, kecamatan: val, desa: '' });
            };

            const handleDesaChange = (e) => {
                const val = e.target.value;
                setDesa(val);
                onAddressChange({ provinsi, kabupaten, kecamatan, desa: val });
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Provinsi</label>
                        <select 
                            value={provinsi} 
                            onChange={handleProvinsiChange}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                        >
                            <option value="">Pilih Provinsi</option>
                            {provinsiList.map(p => (
                                <option key={p.id} value={p.id}>{p.name}</option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Kabupaten</label>
                        <select 
                            value={kabupaten} 
                            onChange={handleKabupatenChange}
                            disabled={!provinsi}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100"
                        >
                            <option value="">Pilih Kabupaten</option>
                            {kabupatenList.map(k => (
                                <option key={k.id} value={k.id}>{k.name}</option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Kecamatan</label>
                        <select 
                            value={kecamatan} 
                            onChange={handleKecamatanChange}
                            disabled={!kabupaten}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100"
                        >
                            <option value="">Pilih Kecamatan</option>
                            {kecamatanList.map(k => (
                                <option key={k.id} value={k.id}>{k.name}</option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">Desa</label>
                        <select 
                            value={desa} 
                            onChange={handleDesaChange}
                            disabled={!kecamatan}
                            className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100"
                        >
                            <option value="">Pilih Desa</option>
                            {desaList.map(d => (
                                <option key={d.id} value={d.id}>{d.name}</option>
                            ))}
                        </select>
                    </div>
                </div>
            );
        }

        // ==================== FORM VERIFIKASI ====================
        function FormVerifikasi({ initialData = {}, onSubmit, type = 'santri' }) {
            const [formData, setFormData] = useState(initialData);
            const [address, setAddress] = useState({
                provinsi: initialData.provinsi || '',
                kabupaten: initialData.kabupaten || '',
                kecamatan: initialData.kecamatan || '',
                desa: initialData.desa || ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleAddressChange = (newAddress) => {
                setAddress(newAddress);
                setFormData(prev => ({ ...prev, ...newAddress }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit({ ...formData, ...address });
            };

            if (type === 'santri') {
                return (
                    <form onSubmit={handleSubmit} className="space-y-6 animate-fade-in">
                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4">Data Santri</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nama</label>
                                    <input 
                                        type="text" 
                                        name="namaSantri"
                                        value={formData.namaSantri || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">NIK</label>
                                    <input 
                                        type="text" 
                                        name="nikSantri"
                                        value={formData.nikSantri || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Tempat Lahir</label>
                                    <input 
                                        type="text" 
                                        name="tempatLahir"
                                        value={formData.tempatLahir || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Tanggal Lahir</label>
                                    <input 
                                        type="date" 
                                        name="tanggalLahir"
                                        value={formData.tanggalLahir || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Jenis Kelamin</label>
                                    <select 
                                        name="jenisKelamin"
                                        value={formData.jenisKelamin || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    >
                                        <option value="">Pilih Jenis Kelamin</option>
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Anak ke-</label>
                                    <input 
                                        type="number" 
                                        name="anakKe"
                                        value={formData.anakKe || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4">Ayah</h3>
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Status Ayah</label>
                                <select 
                                    name="statusAyah"
                                    value={formData.statusAyah || 'Hidup'}
                                    onChange={handleChange}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                >
                                    <option value="Hidup">Hidup</option>
                                    <option value="Meninggal">Meninggal</option>
                                </select>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nama Ayah</label>
                                    <input 
                                        type="text" 
                                        name="namaAyah"
                                        value={formData.namaAyah || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                {formData.statusAyah !== 'Meninggal' && (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">NIK Ayah</label>
                                            <input 
                                                type="text" 
                                                name="nikAyah"
                                                value={formData.nikAyah || ''}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Pekerjaan Ayah</label>
                                            <input 
                                                type="text" 
                                                name="pekerjaanAyah"
                                                value={formData.pekerjaanAyah || ''}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Gaji Ayah (Rp)</label>
                                            <input 
                                                type="number" 
                                                name="gajiAyah"
                                                value={formData.gajiAyah || ''}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4">Ibu</h3>
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Status Ibu</label>
                                <select 
                                    name="statusIbu"
                                    value={formData.statusIbu || 'Hidup'}
                                    onChange={handleChange}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                >
                                    <option value="Hidup">Hidup</option>
                                    <option value="Meninggal">Meninggal</option>
                                </select>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nama Ibu</label>
                                    <input 
                                        type="text" 
                                        name="namaIbu"
                                        value={formData.namaIbu || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                {formData.statusIbu !== 'Meninggal' && (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">NIK Ibu</label>
                                            <input 
                                                type="text" 
                                                name="nikIbu"
                                                value={formData.nikIbu || ''}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Pekerjaan Ibu</label>
                                            <input 
                                                type="text" 
                                                name="pekerjaanIbu"
                                                value={formData.pekerjaanIbu || ''}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Gaji Ibu (Rp)</label>
                                            <input 
                                                type="number" 
                                                name="gajiIbu"
                                                value={formData.gajiIbu || ''}
                                                onChange={handleChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            />
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4">Alamat</h3>
                            <AddressCascader onAddressChange={handleAddressChange} initialValues={address} />
                            <div className="mt-4">
                                <label className="block text-sm font-medium text-gray-700 mb-2">Alamat Lengkap</label>
                                <textarea 
                                    name="alamatLengkap"
                                    value={formData.alamatLengkap || ''}
                                    onChange={handleChange}
                                    rows="3"
                                    className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>
                        </div>

                        <button 
                            type="submit"
                            className="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-semibold py-3 rounded-lg hover:shadow-lg transition-all duration-200"
                        >
                            Simpan Data Santri
                        </button>
                    </form>
                );
            } else if (type === 'ustadz') {
                return (
                    <form onSubmit={handleSubmit} className="space-y-6 animate-fade-in">
                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-semibold text-gray-800 mb-4">Data Ustadz</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nama</label>
                                    <input 
                                        type="text" 
                                        name="namaUstadz"
                                        value={formData.namaUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Gelar</label>
                                    <input 
                                        type="text" 
                                        name="gelarUstadz"
                                        value={formData.gelarUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">NIK</label>
                                    <input 
                                        type="text" 
                                        name="nikUstadz"
                                        value={formData.nikUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Tempat Lahir</label>
                                    <input 
                                        type="text" 
                                        name="tempatLahirUstadz"
                                        value={formData.tempatLahirUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Tanggal Lahir</label>
                                    <input 
                                        type="date" 
                                        name="tanggalLahirUstadz"
                                        value={formData.tanggalLahirUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Jenis Kelamin</label>
                                    <select 
                                        name="jenisKelaminUstadz"
                                        value={formData.jenisKelaminUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    >
                                        <option value="">Pilih Jenis Kelamin</option>
                                        <option value="Laki-laki">Laki-laki</option>
                                        <option value="Perempuan">Perempuan</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Pekerjaan</label>
                                    <input 
                                        type="text" 
                                        name="pekerjaanUstadz"
                                        value={formData.pekerjaanUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Nomor HP</label>
                                    <input 
                                        type="tel" 
                                        name="nomorHpUstadz"
                                        value={formData.nomorHpUstadz || ''}
                                        onChange={handleChange}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>

        // ==================== TIMER COMPONENT ====================
        function Timer({ onTimeChange, reset = false }) {
            const [seconds, setSeconds] = useState(0);
            const intervalRef = useRef(null);

            useEffect(() => {
                if (reset) {
                    setSeconds(0);
                }
            }, [reset]);

            useEffect(() => {
                intervalRef.current = setInterval(() => {
                    setSeconds(prev => {
                        const newVal = prev + 1;
                        onTimeChange(newVal);
                        return newVal;
                    });
                }, 1000);
                return () => clearInterval(intervalRef.current);
            }, [onTimeChange]);

            const formatTime = (totalSec) => {
                const m = Math.floor(totalSec / 60);
                const s = totalSec % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="text-center p-4 bg-gradient-to-r from-green-50 to-blue-50 rounded-lg">
                    <p className="text-sm text-gray-600 mb-2">Waktu Tempuh</p>
                    <p className="text-4xl font-bold text-blue-600">{formatTime(seconds)}</p>
                </div>
            );
        }

        // ==================== IMAGE PROCESSING ====================
        async function processImageForGemini(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1024;
                        
                        if (width > height) {
                            if (width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const base64 = canvas.toDataURL('image/jpeg').split(',')[1];
                        resolve(base64);
                    };
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ==================== GEMINI API CALL ====================
        async function callGeminiAPI(apiKey, base64Image, prompt, retries = 3) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
            
            for (let attempt = 0; attempt < retries; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    {
                                        inline_data: {
                                            mime_type: 'image/jpeg',
                                            data: base64Image
                                        }
                                    }
                                ]
                            }]
                        })
                    });

                    if (response.status === 401 || response.status === 403) {
                        throw new Error('Invalid API Key');
                    }

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || 'Gemini API Error');
                    }

                    const data = await response.json();
                    const text = data.contents?.[0]?.parts?.[0]?.text || '';
                    
                    // Remove markdown code blocks if present
                    const jsonStr = text.replace(/```json\n?|\n?```/g, '').trim();
                    return JSON.parse(jsonStr);
                } catch (error) {
                    if (attempt === retries - 1) throw error;
                    await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
                }
            }
        }

                const file = e.target.files[0];

                    setStep('processKkUstadz');

            };

            const handleProcessKkUstadz = async () => {
                if (!kkImage) {
                    onShowToast('Upload Kartu Keluarga terlebih dahulu', 'warning');
                    return;
                }

                setLoading(true);
                try {
                    const base64 = await processImageForGemini(kkImage);
                    const prompt = `Ekstrak data ibu dari Kartu Keluarga ini. 
                    Kembalikan data dalam format JSON HANYA (tanpa markdown):
                    {
                        "namaIbuUstadz": "...",
                        "nikIbuUstadz": "...",
                        "tempatLahirIbuUstadz": "...",
                        "tanggalLahirIbuUstadz": "..."
                    }`;

                    const result = await callGeminiAPI(appConfig.apiKey, base64, prompt);
                    setFormData(prev => ({ ...prev, ...result }));
                    setStep('verifyData');
                } catch (error) {
                    onShowToast(error.message || 'Gagal memproses gambar', 'error');
                } finally {
                    setLoading(false);
                }

                    data: finalData,
                    namaLembaga: testerInfo.namaLembaga

                    fetch(appConfig.gasUrl, {
                        method: 'POST',
                        body: JSON.stringify(logEntry)
                    }).catch(e => console.error('GAS send error:', e));

                                    <div className="space-y-4 text-sm">
                                        <p>Diberikan kepada yang bersangkutan berkenaan dengan tugas mengajar di</p>
                                        <p className="text-center font-bold">{testerInfo.namaLembaga}</p>
                                        <p>Tanggal Disetujui: {new Date(selectedDoc.tanggalDisetujui).toLocaleString('id-ID')}</p>
                                    </div>
                                </div>

                                <div className="print-footer">
                                    <div className="print-signature">
                                        <p className="mb-12">Kepala Lembaga,</p>
                                        <p className="font-bold">{testerInfo.namaKepala}</p>
                                    </div>
                                    <img src={`https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${selectedDoc.docId}`} alt="QR" className="print-qr" />
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={handlePrint}
                            className="w-full px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 no-print flex items-center justify-center gap-2"
                        >
                            <i className="fas fa-print"></i>
                            Cetak Document
                        </button>
                    </div>
                );
            }

            return (
                <div className="space-y-6 animate-fade-in">
                    <h3 className="text-lg font-semibold text-gray-800">Arsip Document</h3>
                    {approvedDocs.length === 0 ? (
                        <div className="bg-white rounded-lg shadow-sm p-8 text-center text-gray-500 border border-gray-200">
                            <i className="fas fa-archive text-4xl mb-4 block opacity-50"></i>
                            <p>Belum ada document yang disetujui</p>
                        </div>
                    ) : (
                        <div className="grid gap-4">
                            {approvedDocs.map(doc => (
                                <div 
                                    key={doc.id}
                                    onClick={() => setSelectedDoc(doc)}
                                    className="bg-white rounded-lg shadow-sm p-6 border border-gray-200 cursor-pointer hover:shadow-lg hover:border-blue-500 transition-all"
                                >
                                    <p className="font-semibold text-gray-800">{doc.tipeDocument}</p>
                                    <p className="text-sm text-gray-600">{doc.docId}</p>
                                    <p className="text-xs text-gray-500">{new Date(doc.tanggalDisetujui).toLocaleString('id-ID')}</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ==================== MAIN APP ====================
        function App() {
            const [appState, setAppState] = useState(() => {
                const saved = localStorage.getItem('lpq_app_state');
                return saved ? JSON.parse(saved) : {
                    setupComplete: false,
                    currentView: 'welcome',
                    currentRole: null,
                    testerInfo: {},
                    appConfig: { apiKey: '', gasUrl: '' },
                    researchLogs: [],
                    santriData: [],
                    ustadzData: [
                        { id: '1', nama: 'Ustadz Ahmad' },
                        { id: '2', nama: 'Ustadz Budi' }
                    ],
                    dokumenReq: [],
                    kuisionerData: []
                };
            });

            const [toast, setToast] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('lpq_app_state', JSON.stringify(appState));
            }, [appState]);

            const handleSetupComplete = (data, isAdmin) => {
                const newAppConfig = localStorage.getItem('lpq_app_config');
                setAppState(prev => ({
                    ...prev,
                    setupComplete: true,
                    currentView: 'login',
                    testerInfo: data,
                    currentRole: isAdmin ? 'admin' : null,
                    appConfig: newAppConfig ? JSON.parse(newAppConfig) : { apiKey: '', gasUrl: '' }
                }));
            };

            const handleRoleSelect = (role) => {
                const viewMap = {
                    admin: 'adminDashboard',
                    operator: 'experimentEntry',
                    kepala: 'approval',
                    public: 'researchReport'
                };
                setAppState(prev => ({
                    ...prev,
                    currentRole: role,
                    currentView: viewMap[role]
                }));
                setSidebarOpen(false);
            };

            const handleConfigUpdate = (config) => {
                localStorage.setItem('lpq_app_config', JSON.stringify(config));
                setAppState(prev => ({
                    ...prev,
                    appConfig: config
                }));
                showToast('Konfigurasi berhasil disimpan', 'success');
            };

            const handleLogSave = (logEntry) => {
                setAppState(prev => ({
                    ...prev,
                    researchLogs: [...prev.researchLogs, logEntry]
                }));
            };

            const handleRequestSubmit = (request) => {
                setAppState(prev => ({
                    ...prev,
                    dokumenReq: [...prev.dokumenReq, request]
                }));
            };

            const handleApprove = (requestId) => {
                setAppState(prev => ({
                    ...prev,
                    dokumenReq: prev.dokumenReq.map(d => 
                        d.id === requestId 
                            ? { ...d, status: 'Disetujui', docId: `DOC-LPQ-${Date.now()}`, tanggalDisetujui: new Date().toISOString() }
                            : d
                    )
                }));
                showToast('Document berhasil disetujui', 'success');
            };

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            if (!appState.setupComplete) {
                return <WelcomeTesterScreen onSetupComplete={handleSetupComplete} />;
            }

            if (!appState.currentRole) {
                return <LoginScreen testerInfo={appState.testerInfo} onRoleSelect={handleRoleSelect} />;
            }

            const roleIcons = {
                admin: 'cog',
                operator: 'user-tie',
                kepala: 'crown',
                public: 'eye'
            };

            const roleNames = {
                admin: 'Admin',
                operator: 'Operator',
                kepala: 'Kepala',
                public: 'Publik'
            };

            const sidebarItems = {
                admin: [
                    { id: 'adminDashboard', label: 'Pusat Riset', icon: 'chart-line' },
                    { id: 'logout', label: 'Logout', icon: 'sign-out-alt' }
                ],
                operator: [
                    { id: 'experimentEntry', label: 'OCR Eksperimen', icon: 'flask' },
                    { id: 'researchReport', label: 'Laporan Riset', icon: 'file-alt' },
                    { id: 'kuisioner', label: 'Kuisioner', icon: 'clipboard' },
                    { id: 'requestDocument', label: 'Permintaan Doc', icon: 'file-invoice' },
                    { id: 'logout', label: 'Logout', icon: 'sign-out-alt' }
                ],
                kepala: [
                    { id: 'approval', label: 'Persetujuan', icon: 'check-square' },
                    { id: 'arsip', label: 'Arsip', icon: 'archive' },
                    { id: 'researchReport', label: 'Laporan', icon: 'file-alt' },
                    { id: 'logout', label: 'Logout', icon: 'sign-out-alt' }
                ],
                public: [
                    { id: 'researchReport', label: 'Laporan Riset', icon: 'file-alt' },
                    { id: 'logout', label: 'Logout', icon: 'sign-out-alt' }
                ]
            };

            const handleLogout = () => {
                setAppState(prev => ({
                    ...prev,
                    currentRole: null,
                    currentView: 'login'
                }));
            };

            const handleNavigate = (viewId) => {
                if (viewId === 'logout') {
                    handleLogout();
                } else {
                    setAppState(prev => ({
                        ...prev,
                        currentView: viewId
                    }));
                }
                setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen bg-gray-50">
                    {/* SIDEBAR */}
                    <div className={`fixed inset-y-0 left-0 w-64 bg-gradient-to-b from-blue-600 to-indigo-700 text-white transform transition-transform duration-300 z-40 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 lg:relative`}>
                        <div className="p-6 border-b border-blue-500">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 bg-white/20 rounded-lg flex items-center justify-center">
                                    <i className={`fas fa-${roleIcons[appState.currentRole]} text-xl`}></i>
                                </div>
                                <div>
                                    <p className="font-bold text-white">{roleNames[appState.currentRole]}</p>
                                    <p className="text-xs text-blue-200">{appState.testerInfo.namaLembaga}</p>
                                </div>
                            </div>
                        </div>
                        <nav className="mt-6">
                            {sidebarItems[appState.currentRole]?.map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => handleNavigate(item.id)}
                                    className={`w-full text-left px-6 py-3 flex items-center gap-3 transition-all ${
                                        appState.currentView === item.id
                                            ? 'bg-white/20 border-r-4 border-white font-semibold'
                                            : 'hover:bg-white/10'
                                    }`}
                                >
                                    <i className={`fas fa-${item.icon} w-5`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex-1 flex flex-col overflow-hidden">
                        {/* HEADER */}
                        <div className="bg-white border-b border-gray-200 shadow-sm">
                            <div className="flex items-center justify-between h-16 px-6">
                                <div className="flex items-center gap-4">
                                    <button 
                                        onClick={() => setSidebarOpen(!sidebarOpen)}
                                        className="lg:hidden p-2 hover:bg-gray-100 rounded-lg transition-all"
                                    >
                                        <i className="fas fa-bars text-xl text-gray-700"></i>
                                    </button>
                                    <div>
                                        <h1 className="text-xl font-bold text-gray-800">Portal Eksperimen & Administrasi LPQ</h1>
                                        <p className="text-xs text-gray-500">{appState.testerInfo.namaLembaga}</p>
                                    </div>
                                </div>
                                {appState.testerInfo.logo && (
                                    <img src={appState.testerInfo.logo} alt="Logo" className="h-12 w-auto" />
                                )}
                            </div>
                        </div>

                        {/* CONTENT AREA */}
                        <div className="flex-1 overflow-auto custom-scrollbar">
                            <div className="p-6 max-w-7xl mx-auto w-full">
                                {appState.currentView === 'adminDashboard' && (
                                    <AdminDashboardView 
                                        appConfig={appState.appConfig}
                                        onConfigUpdate={handleConfigUpdate}
                                        researchLogs={appState.researchLogs}
                                        ustadzData={appState.ustadzData}
                                    />
                                )}
                                {appState.currentView === 'experimentEntry' && (
                                    <ExperimentEntryView 
                                        appConfig={appState.appConfig}
                                        testerInfo={appState.testerInfo}
                                        onLogSave={handleLogSave}
                                        onShowToast={showToast}
                                    />
                                )}
                                {appState.currentView === 'researchReport' && (
                                    <ResearchReportView researchLogs={appState.researchLogs} />
                                )}
                                {appState.currentView === 'kuisioner' && (
                                    <KuisionerView 
                                        onSubmit={() => showToast('Terima kasih atas feedback Anda', 'success')}
                                        onShowToast={showToast}
                                    />
                                )}
                                {appState.currentView === 'requestDocument' && (
                                    <RequestDocumentView 
                                        ustadzData={appState.ustadzData}
                                        dokumenReq={appState.dokumenReq}
                                        onRequestSubmit={handleRequestSubmit}
                                        onShowToast={showToast}
                                    />
                                )}
                                {appState.currentView === 'approval' && (
                                    <ApprovalView 
                                        dokumenReq={appState.dokumenReq}
                                        onApprove={handleApprove}
                                    />
                                )}
                                {appState.currentView === 'arsip' && (
                                    <ArsipView 
                                        dokumenReq={appState.dokumenReq}
                                        testerInfo={appState.testerInfo}
                                    />
                                )}
                            </div>
                        </div>
                    </div>

                    {/* BACKDROP */}
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black/50 z-30 lg:hidden"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {/* TOAST */}
                    {toast && (
                        <ToastNotification 
                            message={toast.message}
                            type={toast.type}
                            onClose={() => setToast(null)}
                        />
                    )}
                </div>
            );
        }

        // ==================== RENDER ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
